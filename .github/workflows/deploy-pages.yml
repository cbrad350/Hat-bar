name: Deploy to GitHub Pages

# Publishes the register app at https://<owner>.github.io/Hat-bar/.
#
# One-time prerequisite: Settings → Pages → Source = "GitHub Actions". This job
# cannot turn Pages on itself — the built-in workflow token is refused by the
# create-Pages-site endpoint ("Resource not accessible by integration"), and on
# a private repo Pages additionally requires a paid plan (GitHub Pro or above).
#
# Re-deploys on every push to main, and after each catalog sync, so the live
# site always matches the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A catalog sync commits with the built-in token, and such pushes deliberately
  # don't fire `push` workflows — so chain off the sync run itself instead.
  workflow_run:
    workflows: ["Sync Square catalog"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer one supersede a queued older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
